<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF9F6"/>

  <!-- Eyebrow -->
  <text x="80" y="120" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="2" fill="#8A8A82">CORE WEB VITALS</text>

  <!-- Headline -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#1A1A1A">The 1946 experiment</text>
  <text x="80" y="276" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#1A1A1A">that defined the INP</text>
  <text x="80" y="352" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#1A1A1A">threshold.</text>

  <!-- Animation strip -->
  <g transform="translate(80, 430)">
    <!-- Background track -->
    <rect x="0" y="40" width="1040" height="2" fill="#E5E3DB"/>

    <!-- Frame 1: A approaching B -->
    <rect x="20" y="20" width="42" height="42" rx="4" fill="#1A1A1A"/>
    <rect x="160" y="20" width="42" height="42" rx="4" fill="#D85A30"/>
    <text x="111" y="100" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5A5A55" text-anchor="middle">Contact</text>

    <!-- Arrow 1 -->
    <path d="M 240 41 L 290 41 M 285 36 L 290 41 L 285 46" stroke="#8A8A82" stroke-width="1.5" fill="none"/>

    <!-- Frame 2: Touching, B about to move -->
    <rect x="316" y="20" width="42" height="42" rx="4" fill="#1A1A1A"/>
    <rect x="358" y="20" width="42" height="42" rx="4" fill="#D85A30"/>
    <text x="358" y="100" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5A5A55" text-anchor="middle">Delay</text>

    <!-- Arrow 2 -->
    <path d="M 440 41 L 490 41 M 485 36 L 490 41 L 485 46" stroke="#8A8A82" stroke-width="1.5" fill="none"/>

    <!-- Frame 3: B moving away -->
    <rect x="516" y="20" width="42" height="42" rx="4" fill="#1A1A1A"/>
    <rect x="640" y="20" width="42" height="42" rx="4" fill="#D85A30"/>
    <text x="600" y="100" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5A5A55" text-anchor="middle">B moves</text>
  </g>

  <!-- Threshold scale -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="100" height="44" rx="4" fill="#E1F5EE"/>
    <text x="50" y="20" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle">Causal</text>
    <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle">0–100 ms</text>

    <rect x="106" y="0" width="100" height="44" rx="4" fill="#FAEEDA"/>
    <text x="156" y="20" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle">Mixed</text>
    <text x="156" y="36" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">100–200 ms</text>

    <rect x="212" y="0" width="320" height="44" rx="4" fill="#FCEBEB"/>
    <text x="372" y="20" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" font-weight="500" fill="#501313" text-anchor="middle">Two unrelated events</text>
    <text x="372" y="36" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle">over 200 ms</text>
  </g>

  <!-- Byline bottom right -->
  <text x="1120" y="585" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5A5A55" text-anchor="end">corewebvitals.io</text>
</svg>
